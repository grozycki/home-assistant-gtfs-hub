name: gtfs-hub-test

services:
  homeassistant:
    build: .
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      TZ: Europe/Warsaw
      GTFS_HUB_DEMO_VEHICLES: "1"
    volumes:
      - config:/config
      - ../custom_components/gtfs_hub:/config/custom_components/gtfs_hub:ro

volumes:
  config:
