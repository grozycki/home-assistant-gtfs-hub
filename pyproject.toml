[project]
name = "home-assistant-gtfs-hub"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "gtfs-hub",
    "gtfs-hub-gzm",
    "gtfs-realtime-bindings==2.0.0",
    "mypy>=1.13",
    "pytest-cov>=5.0",
    "pytest-homeassistant==2026.11.1",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.sources]
gtfs-hub = { path = "../gtfs-hub", editable = true }
gtfs-hub-gzm = { path = "../gtfs-hub-gzm", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "TC", "PYI"]

[tool.mypy]
strict = true
files = ["custom_components", "tests"]
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "unused-awaitable",
]

# Home Assistant's flow base classes fix these signatures, with Any in them.
[[tool.mypy.overrides]]
module = "custom_components.gtfs_hub.config_flow"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["pytest_homeassistant.*", "freezegun.*"]
ignore_missing_imports = true

# The test plugin ships no types, so its classes read as Any here.
[[tool.mypy.overrides]]
module = [
    "conftest",
    "test_badge",
    "test_config_flow",
    "test_delay_events",
    "test_entities",
    "test_recorder_load",
    "test_shapes",
    "test_vehicle_lifecycle",
    "test_vehicles",
]
disallow_any_unimported = false
