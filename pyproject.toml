[project]
name = "home-assistant-gtfs-hub"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "gtfs-hub",
    "gtfs-hub-gzm",
    "mypy>=1.13",
    "pytest-homeassistant-custom-component",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.sources]
gtfs-hub = { path = "../gtfs-hub", editable = true }
gtfs-hub-gzm = { path = "../gtfs-hub-gzm", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
