get_departures:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gtfs_hub
    stop_key:
      required: true
      example: "2469011-07101"
      selector:
        text:
    limit:
      default: 10
      selector:
        number:
          min: 1
          max: 50
get_line_shapes:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gtfs_hub
    line:
      required: true
      example: "11"
      selector:
        text:
    route_type:
      example: 3
      selector:
        number:
          min: 0
          max: 1799
          mode: box
