name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The lock file points at ../gtfs-hub and ../gtfs-hub-gzm. Check out the releases the
      # manifest pins, which is what users install, not the libraries' main branches.
      - run: |
          for lib in gtfs-hub gtfs-hub-gzm; do
            pin=$(python3 -c "import json, sys; print(next(r.split('==')[1] for r in json.load(open('custom_components/gtfs_hub/manifest.json'))['requirements'] if r.split('==')[0] == sys.argv[1]))" "$lib")
            git clone --depth 1 --branch "v$pin" "https://github.com/grozycki/$lib.git" "../$lib"
          done
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  # Fail the weekly run once Home Assistant ships a release the tests do not pin yet.
  current-release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pinned=$(grep -oE '"pytest-homeassistant==[^"]+"' pyproject.toml | cut -d= -f3 | tr -d '"')
          latest=$(curl -fsSL https://pypi.org/pypi/pytest-homeassistant/json | python3 -c "import json, sys; print(json.load(sys.stdin)['info']['version'])")
          echo "pinned $pinned, latest $latest"
          test "$pinned" = "$latest" || { echo "::error::Move the tests to pytest-homeassistant==$latest"; exit 1; }
